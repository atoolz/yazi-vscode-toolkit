<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="editorClip">
      <rect x="0" y="0" width="800" height="500" rx="8"/>
    </clipPath>
  </defs>

  <g clip-path="url(#editorClip)">
    <!-- Editor background -->
    <rect width="800" height="500" rx="8" fill="#1e1e1e"/>

    <!-- Title bar -->
    <rect width="800" height="36" rx="8" fill="#323233"/>
    <rect y="28" width="800" height="8" fill="#323233"/>
    <!-- Traffic lights -->
    <circle cx="20" cy="18" r="6" fill="#ff5f57"/>
    <circle cx="40" cy="18" r="6" fill="#febc2e"/>
    <circle cx="60" cy="18" r="6" fill="#28c840"/>
    <!-- Tab -->
    <rect x="100" y="4" width="130" height="28" fill="#1e1e1e" rx="4"/>
    <text x="115" y="22" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="12" fill="#cccccc">yazi.toml</text>
    <!-- Breadcrumb -->
    <rect y="36" width="800" height="24" fill="#252526"/>
    <text x="50" y="52" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="11" fill="#888">yazi.toml > [manager]</text>

    <!-- Line numbers gutter -->
    <rect x="0" y="60" width="44" height="440" fill="#1e1e1e"/>

    <!-- Code content -->
    <g font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="14">
      <!-- Line 1 -->
      <text x="16" y="86" fill="#555" font-size="13">1</text>
      <text x="52" y="86" fill="#6a9955"># Yazi file manager configuration</text>

      <!-- Line 2 -->
      <text x="16" y="110" fill="#555" font-size="13">2</text>

      <!-- Line 3 -->
      <text x="16" y="134" fill="#555" font-size="13">3</text>
      <text x="52" y="134" fill="#dcdcaa">[manager]</text>

      <!-- Line 4 -->
      <text x="16" y="158" fill="#555" font-size="13">4</text>
      <text x="52" y="158" fill="#9cdcfe">ratio</text>
      <text x="96" y="158" fill="#d4d4d4"> = </text>
      <text x="120" y="158" fill="#ce9178">[1, 4, 3]</text>

      <!-- Line 5 -->
      <text x="16" y="182" fill="#555" font-size="13">5</text>
      <text x="52" y="182" fill="#9cdcfe">sort_by</text>
      <text x="112" y="182" fill="#d4d4d4"> = </text>
      <text x="136" y="182" fill="#ce9178">"alphabetical"</text>

      <!-- Line 6 -->
      <text x="16" y="206" fill="#555" font-size="13">6</text>
      <text x="52" y="206" fill="#9cdcfe">sort_dir_first</text>
      <text x="178" y="206" fill="#d4d4d4"> = </text>
      <text x="202" y="206" fill="#569cd6">true</text>

      <!-- Line 7 -->
      <text x="16" y="230" fill="#555" font-size="13">7</text>
      <text x="52" y="230" fill="#9cdcfe">show_hidden</text>
      <text x="152" y="230" fill="#d4d4d4"> = </text>
      <text x="176" y="230" fill="#569cd6">false</text>

      <!-- Line 8 -->
      <text x="16" y="254" fill="#555" font-size="13">8</text>
      <text x="52" y="254" fill="#9cdcfe">scrolloff</text>
      <text x="134" y="254" fill="#d4d4d4"> = </text>
      <text x="158" y="254" fill="#b5cea8">5</text>

      <!-- Line 9 (typing with cursor) -->
      <text x="16" y="278" fill="#555" font-size="13">9</text>
      <text x="52" y="278" fill="#9cdcfe">s</text>
      <!-- Cursor -->
      <rect x="62" y="265" width="2" height="18" fill="#06b6d4">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>

      <!-- Line 10 -->
      <text x="12" y="302" fill="#555" font-size="13">10</text>

      <!-- Line 11 -->
      <text x="12" y="326" fill="#555" font-size="13">11</text>
      <text x="52" y="326" fill="#dcdcaa">[preview]</text>

      <!-- Line 12 -->
      <text x="12" y="350" fill="#555" font-size="13">12</text>
      <text x="52" y="350" fill="#9cdcfe">tab_size</text>
      <text x="126" y="350" fill="#d4d4d4"> = </text>
      <text x="150" y="350" fill="#b5cea8">2</text>
    </g>

    <!-- Completion dropdown -->
    <g filter="url(#glow)">
      <rect x="50" y="285" width="340" height="200" rx="4" fill="#252526" stroke="#454545" stroke-width="1"/>

      <g font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="13">
        <!-- Selected item -->
        <rect x="52" y="287" width="336" height="24" fill="#094771" rx="2"/>
        <text x="72" y="304" fill="#06b6d4">&#9641;</text>
        <text x="92" y="304" fill="#ffffff">sort_by</text>
        <text x="280" y="304" fill="#888" font-size="10">Sort method</text>

        <text x="72" y="328" fill="#569cd6">&#9641;</text>
        <text x="92" y="328" fill="#cccccc">sort_dir_first</text>
        <text x="280" y="328" fill="#888" font-size="10">Directories first</text>

        <text x="72" y="352" fill="#569cd6">&#9641;</text>
        <text x="92" y="352" fill="#cccccc">sort_sensitive</text>
        <text x="280" y="352" fill="#888" font-size="10">Case sensitive sort</text>

        <text x="72" y="376" fill="#569cd6">&#9641;</text>
        <text x="92" y="376" fill="#cccccc">sort_reverse</text>
        <text x="280" y="376" fill="#888" font-size="10">Reverse order</text>

        <text x="72" y="400" fill="#569cd6">&#9641;</text>
        <text x="92" y="400" fill="#cccccc">sort_translit</text>
        <text x="280" y="400" fill="#888" font-size="10">Transliteration</text>

        <text x="72" y="424" fill="#569cd6">&#9641;</text>
        <text x="92" y="424" fill="#cccccc">show_hidden</text>
        <text x="280" y="424" fill="#888" font-size="10">Show hidden files</text>

        <text x="72" y="448" fill="#569cd6">&#9641;</text>
        <text x="92" y="448" fill="#cccccc">show_symlink</text>
        <text x="280" y="448" fill="#888" font-size="10">Show symlinks</text>

        <text x="72" y="472" fill="#569cd6">&#9641;</text>
        <text x="92" y="472" fill="#cccccc">scrolloff</text>
        <text x="280" y="472" fill="#888" font-size="10">Scroll offset</text>
      </g>
    </g>

    <!-- Detail panel (right side of dropdown) -->
    <rect x="392" y="285" width="260" height="80" rx="4" fill="#252526" stroke="#454545" stroke-width="1"/>
    <g font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="12">
      <text x="406" y="305" fill="#06b6d4" font-weight="bold">sort_by</text>
      <text x="466" y="305" fill="#888">: string</text>
      <text x="406" y="325" fill="#a3a3a3" font-size="11">File sorting method for the</text>
      <text x="406" y="341" fill="#a3a3a3" font-size="11">manager panel.</text>
      <text x="406" y="361" fill="#666" font-size="11">Default: "alphabetical"</text>
    </g>
  </g>
</svg>