<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350">
  <defs>
    <clipPath id="editorClip">
      <rect x="0" y="0" width="800" height="350" rx="8"/>
    </clipPath>
  </defs>

  <g clip-path="url(#editorClip)">
    <!-- Editor background -->
    <rect width="800" height="350" rx="8" fill="#1e1e1e"/>

    <!-- Title bar -->
    <rect width="800" height="36" rx="8" fill="#323233"/>
    <rect y="28" width="800" height="8" fill="#323233"/>
    <circle cx="20" cy="18" r="6" fill="#ff5f57"/>
    <circle cx="40" cy="18" r="6" fill="#febc2e"/>
    <circle cx="60" cy="18" r="6" fill="#28c840"/>
    <rect x="100" y="4" width="130" height="28" fill="#1e1e1e" rx="4"/>
    <text x="115" y="22" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="12" fill="#cccccc">yazi.toml</text>

    <!-- Breadcrumb -->
    <rect y="36" width="800" height="24" fill="#252526"/>
    <text x="50" y="52" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="11" fill="#888">yazi.toml</text>

    <!-- Line numbers gutter -->
    <rect x="0" y="60" width="44" height="180" fill="#1e1e1e"/>

    <!-- Code content -->
    <g font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="14">
      <!-- Line 1 -->
      <text x="16" y="86" fill="#555" font-size="13">1</text>
      <text x="52" y="86" fill="#dcdcaa">[manager]</text>

      <!-- Line 2 -->
      <text x="16" y="110" fill="#555" font-size="13">2</text>
      <text x="52" y="110" fill="#9cdcfe">sort_by</text>
      <text x="112" y="110" fill="#d4d4d4"> = </text>
      <text x="136" y="110" fill="#ce9178">"alphabetical"</text>

      <!-- Line 3: error line - red gutter -->
      <rect x="0" y="119" width="4" height="20" fill="#f44747"/>
      <text x="16" y="134" fill="#555" font-size="13">3</text>
      <text x="52" y="134" fill="#9cdcfe">unknown_option</text>
      <!-- Red squiggly underline -->
      <line x1="52" y1="138" x2="60" y2="136" stroke="#f44747" stroke-width="1.2"/>
      <line x1="60" y1="136" x2="68" y2="138" stroke="#f44747" stroke-width="1.2"/>
      <line x1="68" y1="138" x2="76" y2="136" stroke="#f44747" stroke-width="1.2"/>
      <line x1="76" y1="136" x2="84" y2="138" stroke="#f44747" stroke-width="1.2"/>
      <line x1="84" y1="138" x2="92" y2="136" stroke="#f44747" stroke-width="1.2"/>
      <line x1="92" y1="136" x2="100" y2="138" stroke="#f44747" stroke-width="1.2"/>
      <line x1="100" y1="138" x2="108" y2="136" stroke="#f44747" stroke-width="1.2"/>
      <line x1="108" y1="136" x2="116" y2="138" stroke="#f44747" stroke-width="1.2"/>
      <line x1="116" y1="138" x2="124" y2="136" stroke="#f44747" stroke-width="1.2"/>
      <line x1="124" y1="136" x2="132" y2="138" stroke="#f44747" stroke-width="1.2"/>
      <line x1="132" y1="138" x2="140" y2="136" stroke="#f44747" stroke-width="1.2"/>
      <line x1="140" y1="136" x2="148" y2="138" stroke="#f44747" stroke-width="1.2"/>
      <line x1="148" y1="138" x2="156" y2="136" stroke="#f44747" stroke-width="1.2"/>
      <line x1="156" y1="136" x2="164" y2="138" stroke="#f44747" stroke-width="1.2"/>
      <text x="168" y="134" fill="#d4d4d4"> = </text>
      <text x="192" y="134" fill="#ce9178">"value"</text>

      <!-- Line 4 -->
      <text x="16" y="158" fill="#555" font-size="13">4</text>

      <!-- Line 5: error line - unknown section -->
      <rect x="0" y="163" width="4" height="20" fill="#f44747"/>
      <text x="16" y="182" fill="#555" font-size="13">5</text>
      <text x="52" y="182" fill="#dcdcaa">[foobar]</text>
      <!-- Red squiggly underline -->
      <line x1="52" y1="186" x2="60" y2="184" stroke="#f44747" stroke-width="1.2"/>
      <line x1="60" y1="184" x2="68" y2="186" stroke="#f44747" stroke-width="1.2"/>
      <line x1="68" y1="186" x2="76" y2="184" stroke="#f44747" stroke-width="1.2"/>
      <line x1="76" y1="184" x2="84" y2="186" stroke="#f44747" stroke-width="1.2"/>
      <line x1="84" y1="186" x2="92" y2="184" stroke="#f44747" stroke-width="1.2"/>
      <line x1="92" y1="184" x2="100" y2="186" stroke="#f44747" stroke-width="1.2"/>
      <line x1="100" y1="186" x2="108" y2="184" stroke="#f44747" stroke-width="1.2"/>
      <line x1="108" y1="184" x2="116" y2="186" stroke="#f44747" stroke-width="1.2"/>

      <!-- Line 6 -->
      <text x="16" y="206" fill="#555" font-size="13">6</text>
      <text x="52" y="206" fill="#9cdcfe">something</text>
      <text x="136" y="206" fill="#d4d4d4"> = </text>
      <text x="160" y="206" fill="#b5cea8">42</text>
    </g>

    <!-- Problems panel -->
    <rect x="0" y="240" width="800" height="110" fill="#1e1e1e" stroke="#333" stroke-width="1"/>

    <!-- Problems panel header -->
    <rect x="0" y="240" width="800" height="26" fill="#252526"/>
    <text x="16" y="258" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="12" fill="#cccccc" font-weight="bold">PROBLEMS</text>
    <text x="100" y="258" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="12" fill="#f44747">(2)</text>

    <!-- Problem entries -->
    <g font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="12">
      <!-- Error 1 -->
      <text x="20" y="285" fill="#f44747" font-size="14">&#10006;</text>
      <text x="40" y="285" fill="#cccccc">Unknown option "unknown_option" in section [manager]</text>
      <text x="680" y="285" fill="#888" font-size="11">yazi.toml [3, 1]</text>

      <!-- Error 2 -->
      <text x="20" y="310" fill="#f44747" font-size="14">&#10006;</text>
      <text x="40" y="310" fill="#cccccc">Unknown Yazi section [foobar]</text>
      <text x="680" y="310" fill="#888" font-size="11">yazi.toml [5, 1]</text>
    </g>

    <!-- Status bar -->
    <rect x="0" y="340" width="800" height="10" fill="#007acc"/>
    <rect x="0" y="340" width="120" height="10" fill="#c63030"/>
    <text x="10" y="349" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="9" fill="#ffffff">2 errors</text>
  </g>
</svg>