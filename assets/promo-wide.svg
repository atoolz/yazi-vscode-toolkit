<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1520"/>
      <stop offset="100%" stop-color="#142030"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="accentOrb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accentOrb2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid dots -->
  <g opacity="0.06">
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#94a3b8"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#dots)"/>
  </g>

  <!-- Decorative gradient orbs -->
  <circle cx="200" cy="300" r="250" fill="url(#accentOrb)"/>
  <circle cx="1000" cy="500" r="300" fill="url(#accentOrb2)"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="3" fill="#06b6d4" opacity="0.6"/>

  <!-- Icon -->
  <g transform="translate(80, 180)">
    <rect width="100" height="100" rx="20" fill="url(#iconGrad)"/>
    <rect x="1" y="1" width="98" height="98" rx="19" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.3"/>
    <text x="50" y="50" text-anchor="middle" dominant-baseline="central" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="42" font-weight="700" fill="#ffffff" letter-spacing="-1.5">Ya</text>
  </g>

  <!-- Title -->
  <text x="210" y="215" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="48" font-weight="800" fill="#ffffff" letter-spacing="-1">Yazi Toolkit</text>

  <!-- Subtitle -->
  <text x="210" y="258" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">for VS Code</text>

  <!-- Divider line -->
  <rect x="80" y="310" width="500" height="1" fill="#334155" opacity="0.8"/>

  <!-- Feature list -->
  <g font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#e2e8f0">
    <circle cx="100" cy="352" r="4" fill="#06b6d4"/>
    <text x="120" y="358">12 config sections</text>

    <circle cx="100" cy="392" r="4" fill="#06b6d4"/>
    <text x="120" y="398">Multi-file support (yazi/keymap/theme)</text>

    <circle cx="100" cy="432" r="4" fill="#06b6d4"/>
    <text x="120" y="438">Enum value completions</text>

    <circle cx="100" cy="472" r="4" fill="#06b6d4"/>
    <text x="120" y="478">Real-time validation</text>

    <circle cx="100" cy="512" r="4" fill="#06b6d4"/>
    <text x="120" y="518">5 ready-to-use snippets</text>
  </g>

  <!-- Right side decorative code block -->
  <g transform="translate(660, 140)" opacity="0.9">
    <rect width="460" height="340" rx="12" fill="#0a1520" stroke="#334155" stroke-width="1"/>
    <!-- Window dots -->
    <circle cx="24" cy="20" r="5" fill="#ef4444" opacity="0.7"/>
    <circle cx="44" cy="20" r="5" fill="#eab308" opacity="0.7"/>
    <circle cx="64" cy="20" r="5" fill="#22c55e" opacity="0.7"/>
    <!-- Code lines -->
    <g font-family="'Fira Code', 'Cascadia Code', 'Consolas', monospace" font-size="15">
      <text x="24" y="55" fill="#64748b">[</text><text x="33" y="55" fill="#7dd3fc">manager</text><text x="100" y="55" fill="#64748b">]</text>
      <text x="24" y="80" fill="#c084fc">sort_by</text><text x="88" y="80" fill="#64748b"> = </text><text x="114" y="80" fill="#86efac">"natural"</text>
      <text x="24" y="105" fill="#c084fc">sort_dir_first</text><text x="156" y="105" fill="#64748b"> = </text><text x="182" y="105" fill="#f9a8d4">true</text>
      <text x="24" y="130" fill="#c084fc">show_hidden</text><text x="130" y="130" fill="#64748b"> = </text><text x="156" y="130" fill="#f9a8d4">false</text>
      <text x="24" y="155" fill="#c084fc">linemode</text><text x="104" y="155" fill="#64748b"> = </text><text x="130" y="155" fill="#86efac">"size"</text>
      <text x="24" y="180" fill="#c084fc">scrolloff</text><text x="110" y="180" fill="#64748b"> = </text><text x="136" y="180" fill="#fbbf24">5</text>
      <text x="24" y="215" fill="#64748b">[</text><text x="33" y="215" fill="#7dd3fc">preview</text><text x="100" y="215" fill="#64748b">]</text>
      <text x="24" y="240" fill="#c084fc">max_width</text><text x="110" y="240" fill="#64748b"> = </text><text x="136" y="240" fill="#fbbf24">600</text>
      <text x="24" y="265" fill="#c084fc">tab_size</text><text x="100" y="265" fill="#64748b"> = </text><text x="126" y="265" fill="#fbbf24">2</text>
    </g>
    <!-- Autocomplete popup -->
    <g transform="translate(160, 60)">
      <rect width="240" height="130" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
      <rect x="4" y="6" width="232" height="26" rx="4" fill="#06b6d4" opacity="0.2"/>
      <g font-family="'Fira Code', 'Cascadia Code', 'Consolas', monospace" font-size="13" fill="#e2e8f0">
        <text x="12" y="24" fill="#ffffff" font-weight="600">sort_by</text><text x="80" y="24" fill="#64748b" font-size="11">sorting method</text>
        <text x="12" y="50">sort_sensitive</text><text x="130" y="50" fill="#64748b" font-size="11">case sensitive</text>
        <text x="12" y="76">sort_reverse</text><text x="120" y="76" fill="#64748b" font-size="11">reverse order</text>
        <text x="12" y="102">sort_dir_first</text><text x="130" y="102" fill="#64748b" font-size="11">dirs on top</text>
      </g>
    </g>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="580" width="1200" height="50" fill="#0a1520" opacity="0.7"/>
  <text x="600" y="610" text-anchor="middle" font-family="'Fira Code', 'Cascadia Code', 'Consolas', monospace" font-size="15" fill="#64748b">github.com/atoolz/yazi-vscode-toolkit</text>

  <!-- VS Code badge -->
  <g transform="translate(1020, 590)">
    <rect x="0" y="-12" width="120" height="28" rx="14" fill="#06b6d4" opacity="0.15"/>
    <text x="60" y="6" text-anchor="middle" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#22d3ee">VS Code</text>
  </g>
</svg>