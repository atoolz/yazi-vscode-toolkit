<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1520"/>
      <stop offset="100%" stop-color="#142030"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="accentOrb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accentOrb2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- Subtle grid dots -->
  <g opacity="0.05">
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#94a3b8"/>
    </pattern>
    <rect width="1080" height="1080" fill="url(#dots)"/>
  </g>

  <!-- Decorative gradient orbs -->
  <circle cx="540" cy="200" r="350" fill="url(#accentOrb)"/>
  <circle cx="800" cy="900" r="300" fill="url(#accentOrb2)"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1080" height="3" fill="#06b6d4" opacity="0.6"/>

  <!-- Icon centered -->
  <g transform="translate(470, 80)">
    <rect width="140" height="140" rx="28" fill="url(#iconGrad)"/>
    <rect x="1.5" y="1.5" width="137" height="137" rx="26" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.3"/>
    <text x="70" y="70" text-anchor="middle" dominant-baseline="central" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="700" fill="#ffffff" letter-spacing="-2">Ya</text>
  </g>

  <!-- Title -->
  <text x="540" y="290" text-anchor="middle" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="-1.5">Yazi Toolkit</text>

  <!-- Subtitle -->
  <text x="540" y="340" text-anchor="middle" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="400" fill="#94a3b8">for VS Code</text>

  <!-- Divider -->
  <rect x="440" y="370" width="200" height="1" fill="#334155"/>

  <!-- Feature list centered -->
  <g font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#e2e8f0">
    <circle cx="310" cy="418" r="5" fill="#06b6d4"/>
    <text x="330" y="425">12 config sections</text>

    <circle cx="310" cy="468" r="5" fill="#06b6d4"/>
    <text x="330" y="475">Multi-file support (yazi/keymap/theme)</text>

    <circle cx="310" cy="518" r="5" fill="#06b6d4"/>
    <text x="330" y="525">Enum value completions</text>

    <circle cx="310" cy="568" r="5" fill="#06b6d4"/>
    <text x="330" y="575">Real-time validation</text>

    <circle cx="310" cy="618" r="5" fill="#06b6d4"/>
    <text x="330" y="625">5 ready-to-use snippets</text>
  </g>

  <!-- Code preview block -->
  <g transform="translate(130, 680)">
    <rect width="820" height="280" rx="12" fill="#0a1520" stroke="#334155" stroke-width="1"/>
    <!-- Window dots -->
    <circle cx="24" cy="22" r="5" fill="#ef4444" opacity="0.7"/>
    <circle cx="44" cy="22" r="5" fill="#eab308" opacity="0.7"/>
    <circle cx="64" cy="22" r="5" fill="#22c55e" opacity="0.7"/>
    <!-- Code lines -->
    <g font-family="'Fira Code', 'Cascadia Code', 'Consolas', monospace" font-size="16">
      <text x="24" y="60" fill="#64748b">[</text><text x="34" y="60" fill="#7dd3fc">manager</text><text x="106" y="60" fill="#64748b">]</text>
      <text x="24" y="88" fill="#c084fc">sort_by</text><text x="96" y="88" fill="#64748b"> = </text><text x="124" y="88" fill="#86efac">"natural"</text>
      <text x="24" y="116" fill="#c084fc">sort_dir_first</text><text x="168" y="116" fill="#64748b"> = </text><text x="196" y="116" fill="#f9a8d4">true</text>
      <text x="24" y="144" fill="#c084fc">show_hidden</text><text x="140" y="144" fill="#64748b"> = </text><text x="168" y="144" fill="#f9a8d4">false</text>
      <text x="24" y="172" fill="#c084fc">linemode</text><text x="110" y="172" fill="#64748b"> = </text><text x="138" y="172" fill="#86efac">"size"</text>
      <text x="24" y="200" fill="#c084fc">scrolloff</text><text x="118" y="200" fill="#64748b"> = </text><text x="146" y="200" fill="#fbbf24">5</text>
      <text x="24" y="236" fill="#64748b">[</text><text x="34" y="236" fill="#7dd3fc">preview</text><text x="106" y="236" fill="#64748b">]</text>
      <text x="24" y="264" fill="#c084fc">max_width</text><text x="118" y="264" fill="#64748b"> = </text><text x="146" y="264" fill="#fbbf24">600</text>
    </g>
    <!-- Autocomplete popup -->
    <g transform="translate(450, 60)">
      <rect width="280" height="140" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
      <rect x="4" y="6" width="272" height="28" rx="4" fill="#06b6d4" opacity="0.2"/>
      <g font-family="'Fira Code', 'Cascadia Code', 'Consolas', monospace" font-size="14" fill="#e2e8f0">
        <text x="14" y="26" fill="#ffffff" font-weight="600">sort_by</text><text x="90" y="26" fill="#64748b" font-size="12">sorting method</text>
        <text x="14" y="54">sort_sensitive</text><text x="140" y="54" fill="#64748b" font-size="12">case sensitive</text>
        <text x="14" y="82">sort_reverse</text><text x="130" y="82" fill="#64748b" font-size="12">reverse order</text>
        <text x="14" y="110">sort_dir_first</text><text x="140" y="110" fill="#64748b" font-size="12">dirs on top</text>
      </g>
    </g>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="1030" width="1080" height="50" fill="#0a1520" opacity="0.7"/>
  <text x="540" y="1062" text-anchor="middle" font-family="'Fira Code', 'Cascadia Code', 'Consolas', monospace" font-size="15" fill="#64748b">github.com/atoolz/yazi-vscode-toolkit</text>
</svg>