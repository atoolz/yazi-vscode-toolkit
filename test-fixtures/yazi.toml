# Yazi Configuration - Test Fixture
# https://yazi-rs.github.io/docs/configuration/yazi/

[manager]
ratio = [1, 4, 3]
sort_by = "alphabetical"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
sort_translit = false
linemode = "none"
show_hidden = false
show_symlink = true
scrolloff = 5
mouse_events = ["click", "scroll"]
title_format = "Yazi: {cwd}"

[preview]
tab_size = 2
max_width = 600
max_height = 900
cache_name = ""
ueberzug_scale = 1
ueberzug_offset = [0, 0, 0, 0]

[opener.edit]
run = 'nvim "$@"'
desc = "Open with Neovim"
block = true

[opener.open]
run = 'xdg-open "$@"'
desc = "Open with default application"

[open]
rules = [
  { name = "*/", use = ["edit", "open"] },
  { mime = "text/*", use = ["edit"] },
  { mime = "image/*", use = ["open"] },
]

[tasks]
micro_workers = 10
macro_workers = 25
bizarre_retry = 5
image_alloc = 536870912
image_bound = [0, 0]
suppress_preload = false

[plugin]
prepend_previewers = [
  { name = "*", run = "rich-preview", mime = "text/*" },
]
append_preloaders = [
  { name = "*", run = "image-preload", mime = "image/*" },
]

[input]
cursor_blink = false

[which]
sort_by = "none"
sort_sensitive = false
sort_reverse = false

[log]
enabled = false
